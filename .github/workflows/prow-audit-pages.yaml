name: Deploy Prow Audit Page

on:
  push:
    branches: [oadp-dev, prow-merge-audit]
    paths:
      - 'tools/prow-merge-bot-configs/index.html'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Prepare pages directory
        run: |
          mkdir -p _site
          cp tools/prow-merge-bot-configs/index.html _site/
          cat > _site/badge.json <<'EOF'
          {
            "schemaVersion": 1,
            "label": "prow audit",
            "message": "pending",
            "color": "lightgrey"
          }
          EOF

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
